spring:
  application:
    name: quizcard
  kafka:
    bootstrap-servers: pkc-n98pk.us-west-2.aws.confluent.cloud:9092
    topic: topic_user_quiz_result
    api-key: ${KAFKA_API_KEY}
    api-secret: ${KAFKA_API_SECRET}
    consumer:
      group-id: quiz-result-group
      auto-offset-reset: earliest
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
  confluent:
    schema-registry:
      registry-url: "https://psrc-1ryeo07.us-west-2.aws.confluent.cloud"
      api-key: ${SCHEMA_REGISTRY_API_KEY}
      api-secret: ${SCHEMA_REGISTRY_API_SECRET}
  datasource:
    url: jdbc:postgresql://localhost:5433/quizcard_flink_db
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2