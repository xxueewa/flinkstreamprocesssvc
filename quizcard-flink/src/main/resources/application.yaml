spring:
  application:
    name: quizcard
  kafka:
    bootstrap-servers: pkc-n98pk.us-west-2.aws.confluent.cloud:9092
    topic: topic_user_quiz_result
    consumer:
      group-id: quiz-result-group
      auto-offset-reset: earliest
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      sasl:
        jaas-config: "org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_API_KEY}' password='${KAFKA_API_SECRET}';"
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: jdbc:postgresql://localhost:5433/quizcard_flink_db
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
